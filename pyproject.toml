[project]
name = "slop-mcp"
version = "0.1.0"
description = "A hosted MCP server that turns random semantic entropy into weird buildable project briefs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "mcp[cli]>=1.13.0"
]

[project.scripts]
slop-mcp = "slop_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
